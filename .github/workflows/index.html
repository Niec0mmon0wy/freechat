<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Chat App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-container">
    <h2>Enter Chat</h2>
    <form id="login-form">
      <input id="username-input" placeholder="Enter your name..." autocomplete="off" required />
      <button type="submit">Join Chat</button>
    </form>
  </div>

  <!-- Chat Screen (Hidden by default until login) -->
  <div id="chat-container" style="display: none;">
    <header>
      <h2 id="room-title">Live Chat</h2>
    </header>

    <ul id="messages"></ul>

    <form id="chat-form">
      <input id="message-input" autocomplete="off" placeholder="Type a message..." required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
